apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaker-example
  template:
    metadata:
      labels:
        app: matchmaker-example
    spec:
      containers:
      - name: matchmaker-example
        image: us-docker.pkg.dev/open-match-public-images/open-match2/matchmaker-example
        ports:
        - containerPort: 8080
        env:
        - name: OM_CORE_ADDR
          value: "http://open-match-service.default.svc.cluster.local:50504"
        - name: SOLODUEL_ADDR
          value: "http://soloduel-service.default.svc.cluster.local"
        - name: SOLODUEL_PORT
          value: "80"
        # Default false: accept matches annotated with deactivation_timeout, warn, and increase cycle backoff; set true to reject and re-activate instead.
        # - name: REJECT_MATCHES_ON_DEACTIVATION_TIMEOUT
        #   value: "false"
        # Default 5000 (ms): minimum cycle duration; keep >= p99 om_core.cache.replication.lag so ticket state updates replicate between cycles.
        # - name: MM_CYCLE_MIN_DURATION_MS
        #   value: "5000"
        # Default 500: max ticket IDs per ActivateTickets call; must be <= om-core OM_MAX_STATE_UPDATES_PER_CALL.
        # - name: OM_CORE_MAX_UPDATES_PER_ACTIVATION_CALL
        #   value: "500"
        # Default false: kick off backfill MmfRequests first and start fleet MmfRequests immediately afterward; set true to wait for backfill MmfRequests to finish first.
        # - name: WAIT_FOR_BACKFILL_MMFS
        #   value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaker-example-service
spec:
  selector:
    app: matchmaker-example
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer